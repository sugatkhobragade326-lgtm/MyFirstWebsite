<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 40px 20px;
        }

        .todo {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        input {
            width: 65%;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            background: #f1f1f1;
            margin: 10px 0;
            padding: 12px;
            border-radius: 6px;
            text-align: left;
        }

        li button {
            float: right;
            background: #dc2626;
            padding: 6px 10px;
        }
    </style>
</head>

<body>

<div class="todo">

    <h1>My To-Do List 📝</h1>

    <input id="taskInput" type="text" placeholder="Enter a task">

    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>

</div>

<script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function displayTasks() {
        let list = document.getElementById("taskList");
        list.innerHTML = "";

        tasks.forEach(function(task, index) {

            let li = document.createElement("li");

            li.innerHTML = task +
                ' <button onclick="deleteTask(' + index + ')">Delete</button>';

            list.appendChild(li);
        });
    }

    function addTask() {

        let input = document.getElementById("taskInput");
        let task = input.value.trim();

        if (task === "") {
            alert("Please enter a task!");
            return;
        }

        tasks.push(task);

        localStorage.setItem("tasks", JSON.stringify(tasks));

        input.value = "";

        displayTasks();
    }

    function deleteTask(index) {

        tasks.splice(index, 1);

        localStorage.setItem("tasks", JSON.stringify(tasks));

        displayTasks();
    }

    displayTasks();
</script>

</body>
</html>
